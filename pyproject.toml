[project]
name = "customer-churn-mlops-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "evidently>=0.7.23",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "mlflow>=3.17.2",
    "numpy<2.3",
    "pandas<3",
    "pandera>=0.34.1",
    "psycopg2-binary>=2.9.13",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real training and serving integration"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
